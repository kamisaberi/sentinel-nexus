# Sentinel-Nexus Fleet Command Plane Configuration
# Path: sentinel-nexus/configs/nexus_server.conf

[server]
bind_address = 0.0.0.0
http_port = 9443
sse_port = 9444
grpc_port = 50051

[tls]
enable_ssl = true
ssl_cert_path = /etc/sentinel/certs/server.crt
ssl_key_path = /etc/sentinel/certs/server.key

[ui]
responsive_layout = true
max_frame_width = 100%
enable_dark_mode = true

[telemetry]
sse_keepalive_ms = 1000
metrics_flush_interval_ms = 500