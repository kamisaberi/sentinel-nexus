server:
  bind_address: "0.0.0.0"
  grpc_port: 50051
  rest_api_port: 9443
  ws_stream_port: 9444
  worker_threads: 16

tls:
  enabled: false 
  ca_cert: "configs/certs/ca.crt"
  server_cert: "configs/certs/server.crt"
  server_key: "configs/certs/server.key"

fleet:
  heartbeat_timeout_seconds: 15
  prune_offline_after_hours: 24

forge_bridge:
  enabled: true
  forge_ingest_path: "/var/lib/sentinel-nexus/forge_buffer/"
  uncertainty_threshold_min: 0.40
  uncertainty_threshold_max: 0.60
  max_buffer_vectors: 500000

intelligence:
  ioc_propagation_enabled: true
  default_block_ttl_seconds: 86400 

saas:
  # Set enabled to false for 100% Air-Gapped plants (Zero cloud egress)
  # Set to true when connected to live backend.aryorithm.com
  enabled: false                                  
  nexus_id: "NEXUS-AMSTERDAM-01"                     
  cloud_endpoint: "https://backend.aryorithm.com/api/v1"      
  tenant_id: "tenant-dev-local"                       
  api_key: "ary_dev_secret_key_8000"                  
  sync_interval_sec: 5                                
  max_backoff_sec: 300
  push_telemetry: true                                
  pull_global_threats: true                           
  auth_email: "kami_developer@aryorithm.com"
  auth_password: "password123"
  token_storage_path: "data/cloud_session.json"

training_engine:
  mode: "remote"
  remote_endpoint: "https://backend.aryorithm.com/api/v1/forge/train"
  gpu_device: "cuda:0"
  auto_ota_stage: true